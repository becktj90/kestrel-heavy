name: Core dotnet
# Kestrel.Core C# tests + golden vectors on free ubuntu-latest. No Unity, no macOS, no Build Automation.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: core-dotnet-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-dotnet:
    name: Kestrel.Core golden tests (dotnet)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # Every golden/unit test gates, including TimelineTests.Generation_IsFasterThanAFewMilliseconds.
      # That benchmark's budget is at least 8 ms median / 20 ms worst and grows with a same-process
      # calibration. Hard ceilings are 15 ms / 40 ms. The 2 ms / 5 ms figures stay the floor-device goal.
      - run: dotnet test unity/dotnet/Kestrel.Core.Tests/Kestrel.Core.Tests.csproj --logger "console;verbosity=normal"
      - name: Pier 7 terrain generator
        run: dotnet test unity/Assets/Kestrel.Game/Site/Tests/Dotnet~/Kestrel.Site.Tests.csproj --logger "console;verbosity=normal"
      - run: dotnet test unity/Assets/Kestrel.Game/Pad/Tests/Dotnet~/Kestrel.Pad.Core.Tests.csproj --logger "console;verbosity=normal"
      - run: dotnet test unity/Assets/Kestrel.Game/Vehicle/Tests/Dotnet~/Kestrel.Vehicle.Core.Tests.csproj --logger "console;verbosity=normal"
      - name: Shipping iOS build entry point (editor boundary fakes)
        run: dotnet test unity/dotnet/Kestrel.Build.Tests/Kestrel.Build.Tests.csproj --logger "console;verbosity=normal"
      - name: Thrum guide hooks
        run: dotnet test unity/Assets/Kestrel.Game/Guide/Tests/Dotnet~/Kestrel.Guide.Core.Tests.csproj --logger "console;verbosity=normal"
