# Rebuild the orphan `xcode-export` branch (Unity iOS export for Xcode Cloud).
# Manual only. Never merges into main. See docs/XCODE_CLOUD_PLAN.md / DECISIONS #59.
#
# Secrets: UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD (same as Unity CI).
name: Xcode export

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion / export tag (must be > last export/2.0.0-N, ≥ 100)"
        required: true
        type: string
      ref:
        description: "Git ref to export (branch, tag, or SHA). Default: main"
        required: false
        default: main
        type: string
      upload_testflight:
        description: "Archive and upload this shipping Unity export to internal TestFlight"
        required: false
        default: false
        type: boolean
      credentials_only:
        description: "Check Apple secret bindings without building or uploading"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ inputs.credentials_only && format('testflight-credentials-{0}', github.run_id) || 'xcode-export' }}
  cancel-in-progress: false

env:
  UNITY_VERSION: 6000.3.26f1
  PROJECT_PATH: unity
  TEAM_ID: 9TR6R5LV8M

jobs:
  apple-credentials:
    name: App Store Connect credential preflight
    if: inputs.upload_testflight || inputs.credentials_only
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check required bindings without exposing values
        run: |
          set -euo pipefail
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret $name. Add it securely in repository settings."
              missing=1
            fi
          done
          exit "$missing"

  export-and-publish:
    needs: apple-credentials
    if: always() && !inputs.credentials_only && (!inputs.upload_testflight || needs.apple-credentials.result == 'success')
    name: Unity iOS export → xcode-export
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HAS_LICENSE: ${{ secrets.UNITY_LICENSE != '' }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - name: Require Unity license
        if: env.HAS_LICENSE != 'true'
        run: |
          echo "UNITY_LICENSE secret is empty; cannot export." >&2
          exit 1

      - name: Validate build number
        run: |
          set -euo pipefail
          n="$BUILD_NUMBER"
          [[ "$n" =~ ^[0-9]+$ ]] || { echo "build_number must be an integer"; exit 1; }
          (( n >= 100 )) || { echo "build_number must be >= 100"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          lfs: true

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true

      - uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-iOS-export-${{ hashFiles('unity/Packages/manifest.json', 'unity/Packages/packages-lock.json', 'unity/ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-export-
            Library-iOS-

      - name: Sync game data into Resources
        run: |
          mkdir -p unity/Assets/Resources/KestrelData
          cp data/*.json web/js/economy-data/constants.json unity/Assets/Resources/KestrelData/

      - name: Export iOS Xcode project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: iOS
          buildMethod: Kestrel.Slice.Editor.BuildScript.BuildIOS
          buildsPath: build
          buildName: iOS
          versioning: None
          allowDirtyBuild: true
          customParameters: -khBuildNumber ${{ env.BUILD_NUMBER }}

      - name: Install git-lfs + rsync
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-lfs rsync
          git lfs install

      - name: Publish orphan xcode-export branch
        env:
          SOURCE_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          chmod +x tools/ios-export/publish.sh
          SOURCE_SHA=$(git rev-parse HEAD)
          # GameCI passes -customBuildPath <buildsPath>/<targetPlatform>/<buildName>, so the project is in build/iOS/iOS.
          tools/ios-export/publish.sh "$BUILD_NUMBER" build/iOS/iOS "${SOURCE_SHA:0:12}" "$SOURCE_REF"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcode-export-${{ env.BUILD_NUMBER }}
          path: build/iOS/iOS
          retention-days: 7
          if-no-files-found: error

      - name: Package export for macOS (preserve executable permissions)
        if: inputs.upload_testflight
        run: tar -czf "$RUNNER_TEMP/xcode-ios.tgz" -C build/iOS/iOS .
      - uses: actions/upload-artifact@v4
        if: inputs.upload_testflight
        with:
          name: xcode-testflight-source
          path: ${{ runner.temp }}/xcode-ios.tgz
          retention-days: 1
          if-no-files-found: error

  testflight:
    name: Shipping Unity archive and internal TestFlight upload
    if: inputs.upload_testflight
    needs: export-and-publish
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - name: Check App Store Connect credential bindings
        run: |
          set -euo pipefail
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret $name. Add it securely in repository settings."
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/download-artifact@v4
        with:
          name: xcode-testflight-source
      - name: Unpack and verify shipping identity
        run: |
          set -euo pipefail
          mkdir xcode
          tar -xzf xcode-ios.tgz -C xcode
          python3 - <<'PYTHON'
          import os, pathlib, plistlib, re
          root = pathlib.Path('xcode')
          info = plistlib.loads((root / 'Info.plist').read_bytes())
          if info.get('CFBundleShortVersionString') != '2.0.0':
              raise SystemExit('Unexpected shipping version')
          if info.get('CFBundleVersion') != os.environ['BUILD_NUMBER']:
              raise SystemExit('Export build number differs from requested build')
          pbx = (root / 'Unity-iPhone.xcodeproj/project.pbxproj').read_text()
          if 'kestrelheavy.unityproto' in pbx:
              raise SystemExit('Refusing prototype bundle')
          if not re.search(r'PRODUCT_BUNDLE_IDENTIFIER = "?com\.beckify\.kestrelheavy"?;', pbx):
              raise SystemExit('Shipping bundle identity missing')
          PYTHON
      - name: Prepare API key outside checkout
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"
          openssl pkey -in "$RUNNER_TEMP/asc/AuthKey.p8" -noout
      - name: Archive shipping Unity app
        working-directory: xcode
        run: |
          set -euo pipefail
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/KestrelHeavy.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" archive
      - name: Verify archived version and create export options
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os, pathlib, plistlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          apps = list((root / 'KestrelHeavy.xcarchive/Products/Applications').glob('*.app'))
          if len(apps) != 1:
              raise SystemExit('Expected one archived shipping app')
          info = plistlib.loads((apps[0] / 'Info.plist').read_bytes())
          expected = {'CFBundleIdentifier': 'com.beckify.kestrelheavy',
                      'CFBundleShortVersionString': '2.0.0',
                      'CFBundleVersion': os.environ['BUILD_NUMBER']}
          for name, value in expected.items():
              if info.get(name) != value:
                  raise SystemExit('Archived app does not match requested ' + name)
          options = {'method': 'app-store-connect', 'destination': 'upload',
                     'teamID': os.environ['TEAM_ID'], 'signingStyle': 'automatic',
                     'manageAppVersionAndBuildNumber': False,
                     'testFlightInternalTestingOnly': True}
          (root / 'ExportOptions.plist').write_bytes(plistlib.dumps(options))
          PYTHON
      - name: Upload to internal TestFlight
        run: |
          set -euo pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/KestrelHeavy.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Verify Apple processing and enable existing internal tester groups
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --disable-pip-version-check 'cryptography==50.0.0'
          "$RUNNER_TEMP/asc-venv/bin/python" - <<'PYTHON'
          import base64, json, os, pathlib, time, urllib.parse, urllib.request, urllib.error
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ec, utils
          def encode(value):
              return base64.urlsafe_b64encode(value).rstrip(b'=').decode()
          header = {'alg': 'ES256', 'kid': os.environ['ASC_KEY_ID'], 'typ': 'JWT'}
          payload = {'iss': os.environ['ASC_ISSUER_ID'], 'iat': int(time.time()),
                     'exp': int(time.time()) + 1200, 'aud': 'appstoreconnect-v1'}
          message = encode(json.dumps(header).encode()) + '.' + encode(json.dumps(payload).encode())
          key_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'asc/AuthKey.p8'
          key = serialization.load_pem_private_key(key_path.read_bytes(), password=None)
          r, s = utils.decode_dss_signature(key.sign(message.encode(), ec.ECDSA(hashes.SHA256())))
          token = message + '.' + encode(r.to_bytes(32, 'big') + s.to_bytes(32, 'big'))
          def request(path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request('https://api.appstoreconnect.apple.com' + path, data=data,
                  headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      result = response.read()
                      return json.loads(result) if result else {}
              except urllib.error.HTTPError as error:
                  raise SystemExit('App Store Connect API HTTP ' + str(error.code) + ': ' + error.read().decode())
          apps = request('/v1/apps?' + urllib.parse.urlencode({'filter[bundleId]': 'com.beckify.kestrelheavy'}))['data']
          if len(apps) != 1:
              raise SystemExit('Expected one shipping App Store Connect app')
          app = apps[0]
          build = None
          for attempt in range(20):
              params = urllib.parse.urlencode({'filter[app]': app['id'], 'filter[version]': os.environ['BUILD_NUMBER'], 'limit': 10})
              builds = request('/v1/builds?' + params)['data']
              build = builds[0] if builds else None
              state = build['attributes']['processingState'] if build else None
              print('Apple processing:', state or 'build not visible yet', flush=True)
              if state == 'VALID':
                  break
              if state in ('FAILED', 'INVALID'):
                  raise SystemExit('Apple rejected processing for this build')
              time.sleep(30)
          if not build or build['attributes']['processingState'] != 'VALID':
              raise SystemExit('Upload finished, but Apple processing has not completed; check App Store Connect')
          groups = request('/v1/apps/' + app['id'] + '/betaGroups?limit=200')['data']
          internal = [group for group in groups if group['attributes']['isInternalGroup']]
          if not internal:
              raise SystemExit('Build processed, but no internal TestFlight tester group exists for this app')
          for group in internal:
              if not group['attributes'].get('hasAccessToAllBuilds'):
                  request('/v1/betaGroups/' + group['id'] + '/relationships/builds',
                          {'data': [{'type': 'builds', 'id': build['id']}]})
          request('/v1/betaBuildLocalizations', {'data': {'type': 'betaBuildLocalizations',
              'attributes': {'locale': 'en-US', 'whatsNew': 'Updated Unity source and shipping iOS build validation. Test startup, home, design, flight, and Game Center.'},
              'relationships': {'build': {'data': {'type': 'builds', 'id': build['id']}}}}})
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Kestrel Heavy 2.0.0 (' + os.environ['BUILD_NUMBER'] + ') processed successfully and assigned to ' + str(len(internal)) + ' existing internal TestFlight group(s).\n')
          PYTHON
      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
