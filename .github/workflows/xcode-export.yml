# Rebuild the orphan `xcode-export` branch (Unity iOS export for Xcode Cloud).
# Manual only. Never merges into main. See docs/XCODE_CLOUD_PLAN.md / DECISIONS #59.
#
# Secrets: UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD (same as Unity CI).
name: Xcode export

on:
  workflow_dispatch:
    inputs:
      start_cloud:
        description: "Start the exact export in the existing Xcode Cloud workflow if its webhook did not fire"
        required: false
        default: false
        type: boolean
      build_number:
        description: "CFBundleVersion / export tag (must be > last export/2.0.0-N, ≥ 100)"
        required: true
        type: string
      ref:
        description: "Git ref to export (branch, tag, or SHA). Default: main"
        required: false
        default: main
        type: string

      finalize_build:
        description: "Complete compliance and tester assignment for an already-uploaded build"
        required: false
        default: false
        type: boolean
      credentials_only:
        description: "Check Apple secret bindings without building or uploading"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ (inputs.credentials_only || inputs.finalize_build) && format('testflight-availability-{0}', github.run_id) || 'xcode-export' }}
  cancel-in-progress: false

env:
  UNITY_VERSION: 6000.3.26f1
  PROJECT_PATH: unity
  TEAM_ID: 9TR6R5LV8M

jobs:
  apple-credentials:
    name: App Store Connect credential preflight
    if: inputs.credentials_only || inputs.finalize_build
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ inputs.build_number }}
      KH_EXPECT_EXPORT_SHA: ${{ inputs.ref }}
      KH_START_CLOUD: ${{ inputs.start_cloud }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check required bindings without exposing values
        run: |
          set -euo pipefail
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret $name. Add it securely in repository settings."
              missing=1
            fi
          done
          exit "$missing"

      - name: Verify Apple key format
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"
          openssl pkey -in "$RUNNER_TEMP/asc/AuthKey.p8" -noout
      - name: Verify Apple app access before building
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --disable-pip-version-check 'cryptography==50.0.0'
          "$RUNNER_TEMP/asc-venv/bin/python" - <<'PYTHON'
          import base64, json, os, pathlib, time, urllib.parse, urllib.request, urllib.error
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ec, utils
          def encode(value):
              return base64.urlsafe_b64encode(value).rstrip(b'=').decode()
          header = {'alg': 'ES256', 'kid': os.environ['ASC_KEY_ID'], 'typ': 'JWT'}
          payload = {'iss': os.environ['ASC_ISSUER_ID'], 'iat': int(time.time()),
                     'exp': int(time.time()) + 1200, 'aud': 'appstoreconnect-v1'}
          message = encode(json.dumps(header).encode()) + '.' + encode(json.dumps(payload).encode())
          key_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'asc/AuthKey.p8'
          key = serialization.load_pem_private_key(key_path.read_bytes(), password=None)
          r, s = utils.decode_dss_signature(key.sign(message.encode(), ec.ECDSA(hashes.SHA256())))
          token = message + '.' + encode(r.to_bytes(32, 'big') + s.to_bytes(32, 'big'))
          def request(path, body=None, method=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request('https://api.appstoreconnect.apple.com' + path, data=data,
                  headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'}, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      result = response.read()
                      return json.loads(result) if result else {}
              except urllib.error.HTTPError as error:
                  raise SystemExit('App Store Connect API HTTP ' + str(error.code) + ': ' + error.read().decode())
          apps = request('/v1/apps?' + urllib.parse.urlencode({'filter[bundleId]': 'com.beckify.kestrelheavy'}))['data']
          if len(apps) != 1:
              raise SystemExit('Expected one shipping App Store Connect app')
          print('App Store Connect access to Kestrel Heavy verified', flush=True)
          builds = request('/v1/builds?' + urllib.parse.urlencode({'filter[app]': apps[0]['id'], 'sort': '-uploadedDate', 'limit': 5}))['data']
          print('Recent Apple builds:', json.dumps([{'build': item['attributes']['version'],
              'processing': item['attributes']['processingState'],
              'uploaded': item['attributes']['uploadedDate']} for item in builds]), flush=True)
          for item in builds[:3]:
              detail = request('/v1/builds/' + item['id'] + '/buildBetaDetail')['data']['attributes']
              print('TestFlight availability:', json.dumps({'build': item['attributes']['version'],
                  'exemptDeclaration': item['attributes'].get('usesNonExemptEncryption'),
                  'internalState': detail.get('internalBuildState'),
                  'externalState': detail.get('externalBuildState')}), flush=True)
          PYTHON
      - name: Inspect Xcode Cloud delivery state
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --disable-pip-version-check 'cryptography==50.0.0'
          "$RUNNER_TEMP/asc-venv/bin/python" - <<'PYTHON'
          import base64, json, os, pathlib, time, urllib.parse, urllib.request, urllib.error
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ec, utils
          def encode(value):
              return base64.urlsafe_b64encode(value).rstrip(b'=').decode()
          header = {'alg': 'ES256', 'kid': os.environ['ASC_KEY_ID'], 'typ': 'JWT'}
          payload = {'iss': os.environ['ASC_ISSUER_ID'], 'iat': int(time.time()),
                     'exp': int(time.time()) + 1200, 'aud': 'appstoreconnect-v1'}
          message = encode(json.dumps(header).encode()) + '.' + encode(json.dumps(payload).encode())
          key_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'asc/AuthKey.p8'
          key = serialization.load_pem_private_key(key_path.read_bytes(), password=None)
          r, s = utils.decode_dss_signature(key.sign(message.encode(), ec.ECDSA(hashes.SHA256())))
          token = message + '.' + encode(r.to_bytes(32, 'big') + s.to_bytes(32, 'big'))
          def request(path, body=None, method=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request('https://api.appstoreconnect.apple.com' + path, data=data,
                  headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'}, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      result = response.read()
                      return json.loads(result) if result else {}
              except urllib.error.HTTPError as error:
                  raise SystemExit('App Store Connect API HTTP ' + str(error.code) + ': ' + error.read().decode())
          apps = request('/v1/apps?' + urllib.parse.urlencode({'filter[bundleId]': 'com.beckify.kestrelheavy'}))['data']
          if len(apps) != 1:
              raise SystemExit('Expected one shipping app')
          product = request('/v1/apps/' + apps[0]['id'] + '/ciProduct')['data']
          workflows = request('/v1/ciProducts/' + product['id'] + '/workflows?limit=200')['data']
          for workflow in workflows:
              attr = workflow['attributes']
              print('Xcode Cloud workflow:', json.dumps({'name': attr['name'], 'enabled': attr['isEnabled'],
                  'automaticBranch': attr.get('branchStartCondition'), 'manualBranch': attr.get('manualBranchStartCondition')}), flush=True)
          runs = request('/v1/ciProducts/' + product['id'] + '/buildRuns?limit=200')['data']
          for item in sorted(runs, key=lambda item: item['attributes'].get('number', 0), reverse=True)[:3]:
              attr = item['attributes']
              print('Xcode Cloud recent run:', json.dumps({'number': attr.get('number'),
                  'progress': attr.get('executionProgress'), 'result': attr.get('completionStatus'),
                  'source': (attr.get('sourceCommit') or {}).get('commitSha'), 'reason': attr.get('startReason')}), flush=True)
          expected = os.environ.get('KH_EXPECT_EXPORT_SHA', '')
          start = os.environ.get('KH_START_CLOUD') == 'true'
          full_sha = len(expected) == 40 and all(char in '0123456789abcdef' for char in expected)
          if start:
              import subprocess
              if not full_sha:
                  raise SystemExit('Manual cloud start requires the full verified export SHA')
              live = subprocess.check_output(['git', 'ls-remote', 'https://github.com/becktj90/kestrel-heavy.git',
                                             'refs/heads/xcode-export'], text=True).split()[0]
              if live != expected:
                  raise SystemExit('Export branch moved; refusing to start a different source')
              existing = next((item for item in runs if (item['attributes'].get('sourceCommit') or {}).get('commitSha') == expected), None)
              if existing is None:
                  candidates = [item for item in workflows if item['attributes']['isEnabled'] and item['attributes']['name'] == 'Kestrel Heavy']
                  if len(candidates) != 1:
                      raise SystemExit('Expected one enabled shipping cloud workflow')
                  workflow = candidates[0]
                  repository = request('/v1/ciWorkflows/' + workflow['id'] + '/repository')['data']
                  refs = request('/v1/scmRepositories/' + repository['id'] + '/gitReferences?limit=200')['data']
                  branches = [item for item in refs if item['attributes'].get('canonicalName') == 'refs/heads/xcode-export' and not item['attributes'].get('isDeleted')]
                  if len(branches) != 1:
                      raise SystemExit('Expected one live xcode-export branch in Apple source control')
                  created = request('/v1/ciBuildRuns', {'data': {'type': 'ciBuildRuns', 'relationships': {
                      'workflow': {'data': {'type': 'ciWorkflows', 'id': workflow['id']}},
                      'sourceBranchOrTag': {'data': {'type': 'scmGitReferences', 'id': branches[0]['id']}}}}})['data']
                  print('Started Xcode Cloud build:', created['attributes'].get('number'), flush=True)
              else:
                  print('Exact export already has a cloud build; leaving it running', flush=True)
          if start and full_sha:
              for attempt in range(30):
                  runs = request('/v1/ciProducts/' + product['id'] + '/buildRuns?limit=200')['data']
                  target = next((item for item in runs if (item['attributes'].get('sourceCommit') or {}).get('commitSha') == expected), None)
                  if target:
                      attr = target['attributes']
                      print('Xcode Cloud progress:', json.dumps({'number': attr.get('number'), 'progress': attr.get('executionProgress'), 'result': attr.get('completionStatus')}), flush=True)
                      if attr.get('executionProgress') == 'COMPLETE':
                          if attr.get('completionStatus') != 'SUCCEEDED':
                              raise SystemExit('Xcode Cloud failed for the exact export')
                          break
                  time.sleep(30)
              else:
                  raise SystemExit('Xcode Cloud is still building; no success claimed')
          PYTHON
      - name: Finalize uploaded build without rebuilding
        if: inputs.finalize_build
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --disable-pip-version-check 'cryptography==50.0.0'
          "$RUNNER_TEMP/asc-venv/bin/python" - <<'PYTHON'
          import base64, json, os, pathlib, time, urllib.parse, urllib.request, urllib.error
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ec, utils
          def encode(value):
              return base64.urlsafe_b64encode(value).rstrip(b'=').decode()
          header = {'alg': 'ES256', 'kid': os.environ['ASC_KEY_ID'], 'typ': 'JWT'}
          payload = {'iss': os.environ['ASC_ISSUER_ID'], 'iat': int(time.time()),
                     'exp': int(time.time()) + 1200, 'aud': 'appstoreconnect-v1'}
          message = encode(json.dumps(header).encode()) + '.' + encode(json.dumps(payload).encode())
          key_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'asc/AuthKey.p8'
          key = serialization.load_pem_private_key(key_path.read_bytes(), password=None)
          r, s = utils.decode_dss_signature(key.sign(message.encode(), ec.ECDSA(hashes.SHA256())))
          token = message + '.' + encode(r.to_bytes(32, 'big') + s.to_bytes(32, 'big'))
          def request(path, body=None, method=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request('https://api.appstoreconnect.apple.com' + path, data=data,
                  headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'}, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      result = response.read()
                      return json.loads(result) if result else {}
              except urllib.error.HTTPError as error:
                  raise SystemExit('App Store Connect API HTTP ' + str(error.code) + ': ' + error.read().decode())
          apps = request('/v1/apps?' + urllib.parse.urlencode({'filter[bundleId]': 'com.beckify.kestrelheavy'}))['data']
          if len(apps) != 1:
              raise SystemExit('Expected one shipping App Store Connect app')
          app = apps[0]
          build = None
          for attempt in range(20):
              params = urllib.parse.urlencode({'filter[app]': app['id'], 'filter[version]': os.environ['BUILD_NUMBER'], 'limit': 10})
              builds = request('/v1/builds?' + params)['data']
              build = builds[0] if builds else None
              state = build['attributes']['processingState'] if build else None
              print('Apple processing:', state or 'build not visible yet', flush=True)
              if state == 'VALID':
                  break
              if state in ('FAILED', 'INVALID'):
                  raise SystemExit('Apple rejected processing for this build')
              time.sleep(30)
          if not build or build['attributes']['processingState'] != 'VALID':
              raise SystemExit('Upload finished, but Apple processing has not completed; check App Store Connect')
          if build['attributes'].get('usesNonExemptEncryption') is not False:
              request('/v1/builds/' + build['id'], {'data': {'type': 'builds', 'id': build['id'],
                  'attributes': {'usesNonExemptEncryption': False}}}, method='PATCH')
          groups = request('/v1/apps/' + app['id'] + '/betaGroups?limit=200')['data']
          internal = [group for group in groups if group['attributes']['isInternalGroup']]
          if not internal:
              raise SystemExit('Build processed, but no internal TestFlight tester group exists for this app')
          request('/v1/builds/' + build['id'] + '/relationships/betaGroups',
                  {'data': [{'type': 'betaGroups', 'id': group['id']} for group in internal]})
          for attempt in range(12):
              detail = request('/v1/builds/' + build['id'] + '/buildBetaDetail')['data']['attributes']
              state = detail.get('internalBuildState')
              print('Internal TestFlight state:', state, flush=True)
              if state == 'IN_BETA_TESTING':
                  break
              time.sleep(5)
          if state != 'IN_BETA_TESTING':
              raise SystemExit('Build compliance is complete, but internal testing has not activated: ' + str(state))
          notes = 'Original Kestrel score, narration ducking, and mute. Portrait designer shows engine defaults, max-Q, and cost. Open and close a tank cutaway, then launch and check assembled geometry and engine effects.'
          localizations = request('/v1/builds/' + build['id'] + '/betaBuildLocalizations?limit=200')['data']
          existing = next((item for item in localizations if item['attributes']['locale'] == 'en-US'), None)
          if existing:
              request('/v1/betaBuildLocalizations/' + existing['id'], {'data': {'type': 'betaBuildLocalizations',
                  'id': existing['id'], 'attributes': {'whatsNew': notes}}}, method='PATCH')
          else:
              request('/v1/betaBuildLocalizations', {'data': {'type': 'betaBuildLocalizations',
                  'attributes': {'locale': 'en-US', 'whatsNew': notes},
                  'relationships': {'build': {'data': {'type': 'builds', 'id': build['id']}}}}})
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Kestrel Heavy 2.0.0 (' + os.environ['BUILD_NUMBER'] + ') processed successfully and assigned to ' + str(len(internal)) + ' existing internal TestFlight group(s).\n')
          PYTHON
      - name: Remove preflight API key
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc"

  export-and-publish:
    if: ${{ !inputs.credentials_only && !inputs.finalize_build }}
    name: Unity iOS export → xcode-export
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HAS_LICENSE: ${{ secrets.UNITY_LICENSE != '' }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - name: Require Unity license
        if: env.HAS_LICENSE != 'true'
        run: |
          echo "UNITY_LICENSE secret is empty; cannot export." >&2
          exit 1

      - name: Validate build number
        run: |
          set -euo pipefail
          n="$BUILD_NUMBER"
          [[ "$n" =~ ^[0-9]+$ ]] || { echo "build_number must be an integer"; exit 1; }
          (( n >= 100 )) || { echo "build_number must be >= 100"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          lfs: true

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true

      - uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-iOS-export-${{ hashFiles('unity/Packages/manifest.json', 'unity/Packages/packages-lock.json', 'unity/ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-export-
            Library-iOS-

      - name: Sync game data into Resources
        run: |
          mkdir -p unity/Assets/Resources/KestrelData
          cp data/*.json web/js/economy-data/constants.json unity/Assets/Resources/KestrelData/

      - name: Export iOS Xcode project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: iOS
          buildMethod: Kestrel.Slice.Editor.BuildScript.BuildIOS
          buildsPath: build
          buildName: iOS
          versioning: None
          allowDirtyBuild: true
          customParameters: -khBuildNumber ${{ env.BUILD_NUMBER }}

      - name: Install git-lfs + rsync
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-lfs rsync
          git lfs install

      - name: Publish orphan xcode-export branch
        env:
          SOURCE_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          chmod +x tools/ios-export/publish.sh
          SOURCE_SHA=$(git rev-parse HEAD)
          # GameCI passes -customBuildPath <buildsPath>/<targetPlatform>/<buildName>, so the project is in build/iOS/iOS.
          tools/ios-export/publish.sh "$BUILD_NUMBER" build/iOS/iOS "${SOURCE_SHA:0:12}" "$SOURCE_REF"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcode-export-${{ env.BUILD_NUMBER }}
          path: build/iOS/iOS
          retention-days: 7
          if-no-files-found: error
