# Unity CI via GameCI (free; public repo = unlimited Actions minutes).
# Secrets (Personal license): UNITY_LICENSE (contents of the .ulf file), UNITY_EMAIL, UNITY_PASSWORD.
# Jobs skip cleanly until UNITY_LICENSE exists.
name: Unity CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: unity-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.3.26f1
  PROJECT_PATH: unity

jobs:
  tests:
    name: Unity tests (${{ matrix.testMode }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        testMode: [EditMode, PlayMode]
    env:
      HAS_LICENSE: ${{ secrets.UNITY_LICENSE != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_LICENSE == 'true'
        with:
          lfs: true
      - uses: actions/cache@v4
        if: env.HAS_LICENSE == 'true'
        with:
          path: unity/Library
          key: Library-test-${{ matrix.testMode }}-${{ hashFiles('unity/Packages/manifest.json', 'unity/Packages/packages-lock.json', 'unity/ProjectSettings/**') }}
          restore-keys: |
            Library-test-${{ matrix.testMode }}-
            Library-
      - uses: game-ci/unity-test-runner@v4
        if: env.HAS_LICENSE == 'true'
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_PATH }}
          testMode: ${{ matrix.testMode }}
          # iOS module image: Assets/Editor/IconSetup.cs uses UnityEditor.iOS.
          customImage: unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-ios-3
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity ${{ matrix.testMode }} results
          artifactsPath: test-results-${{ matrix.testMode }}
      - uses: actions/upload-artifact@v4
        if: always() && env.HAS_LICENSE == 'true'
        with:
          name: test-results-${{ matrix.testMode }}
          path: ${{ steps.tests.outputs.artifactsPath }}

  capture:
    name: Batchmode screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_LICENSE: ${{ secrets.UNITY_LICENSE != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_LICENSE == 'true'
        with:
          lfs: true
      - uses: actions/cache@v4
        if: env.HAS_LICENSE == 'true'
        with:
          path: unity/Library
          key: Library-capture-${{ hashFiles('unity/Packages/manifest.json', 'unity/Packages/packages-lock.json', 'unity/ProjectSettings/**') }}
          restore-keys: |
            Library-capture-
            Library-
      # unity-builder's buildMethod runs any static editor method in batchmode (with a GPU-less
      # software renderer); CiCapture writes PNGs and exits.
      - uses: game-ci/unity-builder@v4
        if: env.HAS_LICENSE == 'true'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: iOS # iOS module needed to compile IconSetup.cs
          buildMethod: Kestrel.EditorTools.CiCapture.Run
          customParameters: -khCapOut /github/workspace/capture-out
          allowDirtyBuild: true
      - uses: actions/upload-artifact@v4
        if: always() && env.HAS_LICENSE == 'true'
        with:
          name: screenshots
          path: capture-out/*.png
          if-no-files-found: warn

  ios-compile:
    name: iOS export compile-check (no Xcode)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_LICENSE: ${{ secrets.UNITY_LICENSE != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_LICENSE == 'true'
        with:
          lfs: true
      - uses: actions/cache@v4
        if: env.HAS_LICENSE == 'true'
        with:
          path: unity/Library
          key: Library-iOS-${{ hashFiles('unity/Packages/manifest.json', 'unity/Packages/packages-lock.json', 'unity/ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-
      # Produces the Xcode project only; compile errors in C# fail this step. Not archived or signed.
      - uses: game-ci/unity-builder@v4
        if: env.HAS_LICENSE == 'true'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: iOS
          allowDirtyBuild: true
