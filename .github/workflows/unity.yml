# Unity CI via GameCI (free; public repo = unlimited Actions minutes).
# Secrets (Personal license): UNITY_LICENSE (contents of the .ulf file), UNITY_EMAIL, UNITY_PASSWORD.
# Jobs skip cleanly until UNITY_LICENSE exists.
name: Unity CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: unity-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.3.26f1
  PROJECT_PATH: unity

jobs:
  tests:
    name: Unity tests (${{ matrix.testMode }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        testMode: [EditMode, PlayMode]
    env:
      HAS_LICENSE: ${{ secrets.UNITY_LICENSE != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_LICENSE == 'true'
        with:
          lfs: true
      - uses: actions/cache@v4
        if: env.HAS_LICENSE == 'true'
        with:
          path: unity/Library
          key: Library-test-${{ matrix.testMode }}-${{ hashFiles('unity/Packages/manifest.json', 'unity/Packages/packages-lock.json', 'unity/ProjectSettings/**') }}
          restore-keys: |
            Library-test-${{ matrix.testMode }}-
            Library-
      - name: Sync game data into Resources (gitignored copies; same as Kestrel > Sync Data)
        if: env.HAS_LICENSE == 'true'
        run: |
          mkdir -p unity/Assets/Resources/KestrelData
          cp data/*.json web/js/economy-data/constants.json unity/Assets/Resources/KestrelData/
      - name: Pack Thrum guide clips into the player
        if: env.HAS_LICENSE == 'true'
        run: bash tools/pack-guide-clips.sh
      # A restored Library can carry a Bee graph from another job. Unity then
      # aborts in a few milliseconds ("dag couldn't be loaded") and reports
      # compiler errors before any test runs. The import cache stays; the graph is rebuilt.
      - name: Drop a cached script graph that will not load
        if: env.HAS_LICENSE == 'true'
        run: rm -rf unity/Library/Bee
      - uses: game-ci/unity-test-runner@v4
        if: env.HAS_LICENSE == 'true'
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_PATH }}
          testMode: ${{ matrix.testMode }}
          # "latest" asks api.github.com for game-ci/cli's newest tag. Several jobs do that
          # at once and the shared runner IP gets HTTP 403 before any test starts.
          cliVersion: v0.1.72
          # iOS module image: Assets/Editor/IconSetup.cs uses UnityEditor.iOS.
          customImage: unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-ios-3
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity ${{ matrix.testMode }} results
          # Wall-clock latency budgets are tuned for the M-series dev box; shared CI runners are 2-5x slower.
          customParameters: '-testFilter !(Kestrel.Core.Tests.ReadoutV2Tests.Recompute_MeetsLatencyBudget|Kestrel.Core.Tests.TimelineTests.Generation_IsFasterThanAFewMilliseconds)'
          artifactsPath: test-results-${{ matrix.testMode }}
      - uses: actions/upload-artifact@v4
        if: always() && env.HAS_LICENSE == 'true'
        with:
          name: test-results-${{ matrix.testMode }}
          # The runner only sets this output after it starts. A failure before that
          # left the path empty and failed the upload with "path not supplied".
          path: test-results-${{ matrix.testMode }}
          if-no-files-found: warn
      # PlayMode = Kestrel.Capture.Tests: real scenes after 60 frames; fails on flat-colour images.
      - uses: actions/upload-artifact@v4
        if: always() && env.HAS_LICENSE == 'true' && matrix.testMode == 'PlayMode'
        with:
          name: screenshots
          path: unity/CaptureOut/*.png
          if-no-files-found: warn


  ios-compile:
    name: iOS export compile-check (no Xcode)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_LICENSE: ${{ secrets.UNITY_LICENSE != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_LICENSE == 'true'
        with:
          lfs: true
      - uses: actions/cache@v4
        if: env.HAS_LICENSE == 'true'
        with:
          path: unity/Library
          key: Library-iOS-${{ hashFiles('unity/Packages/manifest.json', 'unity/Packages/packages-lock.json', 'unity/ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-
      # Produces the Xcode project only; compile errors in C# fail this step. Not archived or signed.
      - name: Sync game data into Resources (gitignored copies; same as Kestrel > Sync Data)
        if: env.HAS_LICENSE == 'true'
        run: |
          mkdir -p unity/Assets/Resources/KestrelData
          cp data/*.json web/js/economy-data/constants.json unity/Assets/Resources/KestrelData/
      - name: Pack Thrum guide clips into the player
        if: env.HAS_LICENSE == 'true'
        run: bash tools/pack-guide-clips.sh
      - uses: game-ci/unity-builder@v4
        if: env.HAS_LICENSE == 'true'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: iOS
          buildMethod: Kestrel.Slice.Editor.BuildScript.BuildIOS
          buildsPath: build
          buildName: iOS
          versioning: None
          allowDirtyBuild: true
          customParameters: -khBuildNumber ${{ github.run_number }}
      - name: Fail if the iOS player has no Thrum clips
        if: success() && env.HAS_LICENSE == 'true'
        run: bash tools/check-built-guide-clips.sh build
      # Artifact only — does not touch the orphan xcode-export branch. Publish via
      # workflow "Xcode export" (workflow_dispatch) or tools/ios-export/export.sh.
      - uses: actions/upload-artifact@v4
        if: env.HAS_LICENSE == 'true' && success()
        with:
          name: xcode-ios-compile
          path: build/iOS/iOS
          retention-days: 7
          if-no-files-found: error
